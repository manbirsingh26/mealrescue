spring.application.name=mealrescue-backend
server.port=8080

# Loads application-local.properties (our private settings, kept out of Git)
spring.profiles.active=local

# Hibernate creates and updates tables from our entities while we develop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.expiration-minutes=120